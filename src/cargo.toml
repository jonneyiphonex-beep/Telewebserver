[package]
name = "telecom_server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- تحسينات الأداء والسرعة الفائقة ---
[profile.release]
opt-level = 3           # أقصى مستوى تحسين بالكود
lto = true              # Link-Time Optimization لإزالة الكود الميت وتحسين الـ Inlining
codegen-units = 1       # دمج وحدات التجميع لزيادة كفاءة التحسين
panic = "abort"         # تقليل حجم الـ Binary وإلغاء unwinding الذاكرة
strip = true            # إزالة رموز التصحيح لتصغير الحجم وزيادة السرعة